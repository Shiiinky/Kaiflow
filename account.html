<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaiflow — Mon compte</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/globals.css">
<style>
/* NAV */
nav { height: 54px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 2rem; gap: 1rem; }
.nav-spacer { flex: 1; }
.nav-link { font-size: 0.85rem; color: var(--muted2); text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.15s; }
.nav-link:hover { background: var(--surface2); color: var(--text); }
.logout-btn { font-size: 0.82rem; color: var(--warn); background: transparent; border: 1px solid rgba(255,107,53,0.3); border-radius: 7px; padding: 0.4rem 0.9rem; cursor: pointer; transition: all 0.15s; }
.logout-btn:hover { background: var(--warn-dim); }

/* CONTENT */
.content { padding: 2.5rem 2rem; max-width: 780px; margin: 0 auto; width: 100%; }
.page-title { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; margin-bottom: 0.3rem; }
.page-sub { font-size: 0.9rem; color: var(--muted2); margin-bottom: 2rem; }

/* SECTIONS */
.section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 1.5rem; overflow: hidden; }
.section-header { padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.section-title { font-family: 'Syne', sans-serif; font-size: 0.92rem; font-weight: 700; }
.section-body { padding: 1.3rem 1.5rem; }

/* PROFILE */
.profile-avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #0077aa); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; color: #000; margin-bottom: 1.2rem; flex-shrink: 0; }
.profile-top { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.5rem; }
.profile-name { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; }
.profile-email { font-size: 0.85rem; color: var(--muted2); margin-top: 0.2rem; }
.profile-badge { display: inline-flex; align-items: center; gap: 0.3rem; margin-top: 0.4rem; background: var(--accent-dim); border: 1px solid rgba(0,229,255,0.2); color: var(--accent); font-size: 0.7rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.06em; }
.fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

.plan-card { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.3rem; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
.plan-name-big { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; }
.plan-details { font-size: 0.8rem; color: var(--muted2); margin-top: 0.2rem; }

.danger-btn { background: transparent; border: 1px solid rgba(255,107,53,0.3); color: var(--warn); padding: 0.6rem 1.2rem; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; transition: all 0.15s; }
.danger-btn:hover { background: var(--warn-dim); border-color: var(--warn); }
</style>
</head>
<body>

<nav>
  <div class="logo">Kai<em>flow</em></div>
  <div class="nav-spacer"></div>
  <a href="/dashboard" class="nav-link">← Dashboard</a>
  <button class="logout-btn" onclick="logout()">Se déconnecter</button>
</nav>

<div class="content">
  <div class="page-title">Mon compte</div>
  <div class="page-sub" id="pageSubtitle">Chargement…</div>

  <div class="section">
    <div class="section-header"><div class="section-title">Informations personnelles</div></div>
    <div class="section-body">
      <div class="profile-top">
        <div class="profile-avatar" id="avatarEl">?</div>
        <div>
          <div class="profile-name" id="profileName">—</div>
          <div class="profile-email" id="profileEmail">—</div>
          <div class="profile-badge" id="profilePlan">Starter</div>
        </div>
      </div>
      <div id="alertMsg" class="alert"></div>

      <div class="fields-grid">
        <div class="field"><label>Prénom</label><input id="firstName" type="text"></div>
        <div class="field"><label>Nom</label><input id="lastName" type="text"></div>
        <div class="field"><label>Entreprise</label><input id="company" type="text"></div>
        <div class="field">
          <label>Secteur</label>
          <select id="sector">
            <option value="">Sélectionnez…</option>
            <option value="automobile">Automobile</option>
            <option value="aeronautique">Aéronautique</option>
            <option value="logistique">Logistique</option>
            <option value="autre">Autre</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" style="width: auto; padding: 0.65rem 1.5rem;" onclick="saveProfile()">Enregistrer</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header"><div class="section-title">Mon abonnement</div></div>
    <div class="section-body">
      <div class="plan-card">
        <div>
          <div class="plan-name-big" id="planName">Starter</div>
          <div class="plan-details" id="planDetails">Gratuit · 1 flux de production</div>
        </div>
        <button class="btn-primary" style="width: auto; padding: 0.6rem 1.2rem; margin:0;" onclick="window.location.href='/signup'">Passer au Pro →</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { supabaseClient, requireAuth, logoutUser } from '/js/supabase-client.js';

  window.logout = logoutUser;
  let currentUser = null;

  async function init() {
    currentUser = await requireAuth();
    if (!currentUser) return;
    
    const meta = currentUser.user_metadata || {};
    const firstName = meta.first_name || '';
    const lastName = meta.last_name || '';
    
    document.getElementById('avatarEl').textContent = ((firstName[0]||'') + (lastName[0]||'')).toUpperCase() || 'U';
    document.getElementById('profileName').textContent = (firstName + ' ' + lastName).trim() || 'Utilisateur';
    document.getElementById('profileEmail').textContent = currentUser.email;
    document.getElementById('pageSubtitle').textContent = 'Bienvenue, ' + (firstName || 'utilisateur') + ' !';
    
    document.getElementById('firstName').value = firstName;
    document.getElementById('lastName').value = lastName;
    document.getElementById('company').value = meta.company || '';
    document.getElementById('sector').value = meta.sector || '';

    const plan = meta.plan || 'free';
    document.getElementById('profilePlan').textContent = plan === 'pro' ? '⚡ Pro' : 'Starter';
    document.getElementById('planName').textContent = plan === 'pro' ? 'Pro' : 'Starter';
    document.getElementById('planDetails').textContent = plan === 'pro' ? '49€ / mois · Flux illimités' : 'Gratuit · 1 flux de production';
  }

  window.saveProfile = async function() {
    const el = document.getElementById('alertMsg');
    const { error } = await supabaseClient.auth.updateUser({
      data: {
        first_name: document.getElementById('firstName').value,
        last_name: document.getElementById('lastName').value,
        company: document.getElementById('company').value,
        sector: document.getElementById('sector').value,
      }
    });
    
    el.className = 'alert ' + (error ? 'error' : 'success');
    el.textContent = error ? '⚠ Erreur lors de la sauvegarde.' : '✓ Profil mis à jour.';
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  init();
</script>
</body>
</html>
