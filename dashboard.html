<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaiflow — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/globals.css">
<style>
  /* CSS Spécifique au layout du Dashboard */
  body { display: flex; overflow: hidden; }
  
  /* Sidebar */
  .sidebar { width: 240px; min-height: 100vh; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
  .sidebar-logo { padding: 1.8rem 1.5rem 1.5rem; border-bottom: 1px solid var(--border); }
  .logo-tag { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.15rem; }
  .sidebar-nav { flex: 1; padding: 1.2rem 0.75rem; display: flex; flex-direction: column; gap: 0.2rem; }
  .nav-section-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); padding: 0.8rem 0.75rem 0.4rem; font-weight: 500; }
  .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0.75rem; border-radius: 8px; cursor: pointer; color: var(--muted2); font-size: 0.88rem; text-decoration: none; position: relative; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(0,229,255,0.08); color: var(--accent); font-weight: 500; }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2px; background: var(--accent); border-radius: 2px; }
  .nav-icon { font-size: 1rem; width: 20px; text-align: center; }
  .sidebar-user { padding: 1rem 1.2rem; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
  .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #0077aa); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 700; color: #000; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-role { font-size: 0.72rem; color: var(--muted); }

  /* Main & Topbar */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 2rem; gap: 1rem; background: var(--bg); }
  .topbar-title { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; flex: 1; }
  .section-count { font-size: 0.8rem; color: var(--muted); font-weight: 400; margin-left: 0.6rem; }
  .topbar-date { font-size: 0.82rem; color: var(--muted); }
  .topbar-btn { display: flex; align-items: center; gap: 0.5rem; background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 0.5rem 1.1rem; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 500; cursor: pointer; }
  
  /* Layout Content */
  .content { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 2rem; }
  .content::-webkit-scrollbar { width: 5px; }
  .content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* Summary Cards */
  .summary-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.3rem 1.5rem; position: relative; animation: fadeUp 0.5s ease both; }
  .summary-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 12px 12px 0 0; }
  .summary-card.c-accent::after { background: var(--accent); }
  .summary-card.c-ok::after { background: var(--ok); }
  .summary-card.c-warn::after { background: var(--warn); }
  .summary-card.c-muted::after { background: var(--muted); }
  .card-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; margin-bottom: 0.75rem; }
  .card-value { font-family: 'Syne', sans-serif; font-size: 2.2rem; font-weight: 800; line-height: 1; margin-bottom: 0.5rem; }
  .card-value.ok { color: var(--ok); }
  .card-value.warn { color: var(--warn); }
  .card-value.accent { color: var(--accent); }
  
  /* Flux Grid */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .section-title { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; }
  .flux-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  .flux-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform 0.2s; animation: fadeUp 0.5s ease both; }
  .flux-card:hover { transform: translateY(-3px); border-color: var(--border2); }
  .flux-preview { background: var(--bg); padding: 1rem 1.2rem 0.8rem; border-bottom: 1px solid var(--border); min-height: 80px; display: flex; align-items: center; }
  .mini-flow { display: flex; align-items: center; gap: 0.4rem; overflow: hidden; }
  .mini-block { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem 0.55rem; font-size: 0.62rem; color: var(--muted2); white-space: nowrap; }
  .mini-block.ok { border-color: rgba(34,211,160,0.3); color: var(--ok); }
  .flux-body { padding: 1rem 1.2rem; }
  .flux-name { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; }
  .flux-meta { font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">Kai<em>flow</em></div>
    <div class="logo-tag">Production Intelligence</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Principal</div>
    <a class="nav-item active"><span class="nav-icon">⬛</span> Dashboard</a>
    <a href="/editor" class="nav-item"><span class="nav-icon">〰</span> Éditeur</a>
    <div class="nav-section-label">Compte</div>
    <a href="/account" class="nav-item"><span class="nav-icon">⚙</span> Paramètres</a>
    <a id="logoutBtn" class="nav-item" style="color:var(--warn)"><span class="nav-icon">↪</span> Déconnexion</a>
  </nav>
  <div class="sidebar-user" onclick="window.location.href='/account'">
    <div class="user-avatar" id="userAvatar">…</div>
    <div class="user-info">
      <div class="user-name" id="userName">Chargement…</div>
      <div class="user-role" id="userRole">—</div>
    </div>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-title">Dashboard <span class="section-count" id="companyTitle">— vue d'ensemble</span></div>
    <div class="topbar-date" id="topbar-date"></div>
    <button class="topbar-btn" onclick="window.location.href='/editor'">✚ Nouveau flux</button>
  </header>

  <div class="content">
    <div class="summary-row">
      <div class="summary-card c-accent">
        <div class="card-label">Flux actifs</div>
        <div class="card-value accent" id="summaryFlux">—</div>
      </div>
      <div class="summary-card c-ok">
        <div class="card-label">Rendement moyen</div>
        <div class="card-value ok" id="summaryRendement">—</div>
      </div>
    </div>

    <div>
      <div class="section-header">
        <div>
          <span class="section-title">Mes flux de production</span>
        </div>
      </div>
      <div class="flux-grid" id="fluxGrid">
        </div>
    </div>
  </div>
</div>

<script type="module">
  import { supabaseClient, requireAuth, logoutUser } from '/js/supabase-client.js';

  // Bind logout
  document.getElementById('logoutBtn').addEventListener('click', logoutUser);

  // Date
  document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  async function init() {
    const user = await requireAuth();
    if(!user) return;

    // UI Setup
    const meta = user.user_metadata || {};
    document.getElementById('userName').textContent = (meta.first_name + ' ' + meta.last_name).trim() || user.email;
    document.getElementById('userAvatar').textContent = ((meta.first_name?.[0]||'') + (meta.last_name?.[0]||'')).toUpperCase() || 'U';
    document.getElementById('userRole').textContent = meta.company || 'Mon entreprise';
    document.getElementById('companyTitle').textContent = `— ${meta.company || 'Mon entreprise'}`;

    // Load Data
    const { data } = await supabaseClient.from('flux').select('*').eq('user_id', user.id).order('updated_at', { ascending: false });
    
    if(!data || data.length === 0) {
      document.getElementById('fluxGrid').innerHTML = `<div class="flux-card" style="border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:190px;grid-column:1/-1;" onclick="window.location.href='/editor'"><div style="text-align:center;color:var(--muted2);"><div style="font-size:2.5rem;">〰</div><div style="font-weight:600;">Aucun flux pour le moment</div></div></div>`;
      document.getElementById('summaryFlux').textContent = '0';
      return;
    }

    document.getElementById('summaryFlux').textContent = data.length;
    
    // Render Grid
    const grid = document.getElementById('fluxGrid');
    grid.innerHTML = data.map(flux => {
      const nodes = JSON.parse(flux.nodes || '[]');
      const miniFlow = nodes.slice(0,3).map(n => `<div class="mini-block ok">${n.label.substring(0,8)}</div>`).join(' → ');
      return `
        <div class="flux-card" onclick="window.location.href='/editor?id=${flux.id}'">
          <div class="flux-preview"><div class="mini-flow">${miniFlow || 'Vide'}</div></div>
          <div class="flux-body">
            <div class="flux-name">${flux.nom}</div>
            <div class="flux-meta">${nodes.length} blocs modélisés</div>
          </div>
        </div>
      `;
    }).join('');
  }

  init();
</script>
</body>
</html>
