<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaiflow — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/globals.css">
<style>
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

  /* TOPBAR */
  .topbar { height: 60px; background: rgba(17,22,32,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; position: sticky; top: 0; z-index: 100; }
  .logo { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .user-profile { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; color: var(--muted); }
  .btn-primary { background: var(--accent); color: #000; border: none; padding: 0.5rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none; font-family: 'DM Sans', sans-serif; }
  .btn-primary:hover { box-shadow: 0 4px 15px rgba(0,229,255,0.25); transform: translateY(-1px); }

  /* LAYOUT */
  .main-content { padding: 2rem; max-width: 1400px; margin: 0 auto; }
  
  .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 3rem; }
  .page-title { font-family: 'Syne', sans-serif; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
  .page-sub { color: var(--muted); font-size: 0.95rem; }

  /* GROUPEMENT (USINE / ATELIER) */
  .usine-section { margin-bottom: 4rem; }
  .usine-title { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--text); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
  .usine-title::before { content: '🏭'; font-size: 1.2rem; }
  
  .atelier-section { margin-bottom: 2.5rem; padding-left: 1rem; border-left: 2px solid var(--border2); }
  .atelier-title { font-size: 1rem; font-weight: 600; color: var(--muted); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 0.5rem; }

  /* GRID & CARDS */
  .flux-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
  
  .flux-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; display: flex; flex-direction: column; transition: all 0.2s; position: relative; overflow: hidden; text-decoration: none; color: inherit; }
  .flux-card:hover { border-color: rgba(0,229,255,0.4); transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
  
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.2rem; }
  .card-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 0.2rem; }
  .card-date { font-size: 0.7rem; color: var(--muted2); }
  
  /* STATUS BADGE */
  .status-badge { font-size: 0.65rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid transparent; }
  .status-ok { background: var(--ok-dim); color: var(--ok); border-color: rgba(34,211,160,0.2); }
  .status-warn { background: var(--warn-dim); color: var(--warn); border-color: rgba(255,107,53,0.2); }
  .status-empty { background: var(--surface2); color: var(--muted); border-color: var(--border); }

  /* KPI GRID INSIDE CARD */
  .card-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1.5rem; }
  .ckpi { background: var(--bg); border: 1px solid var(--border); padding: 0.6rem; border-radius: 6px; }
  .ckpi-label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.2rem; }
  .ckpi-val { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; }
  .ckpi-val.accent { color: var(--accent); }
  .ckpi-val.warn { color: var(--warn); }
  .ckpi-val.ok { color: var(--ok); }
  
  .goulot-line { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 0.4rem; background: var(--bg); padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); }
  .goulot-name { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* NEW FLUX MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 400px; padding: 2rem; transform: translateY(20px); transition: transform 0.2s; }
  .modal-overlay.open .modal-content { transform: translateY(0); }
  .modal-title { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; }
  .input-group { margin-bottom: 1.2rem; }
  .input-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }
  .input-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.7rem; border-radius: 6px; font-family: 'DM Sans', sans-serif; outline: none; }
  .input-group input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 1rem; margin-top: 2rem; }
  .btn-cancel { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 0.7rem; border-radius: 6px; cursor: pointer; }
  .btn-submit { flex: 2; background: var(--accent); border: none; color: #000; font-weight: 600; padding: 0.7rem; border-radius: 6px; cursor: pointer; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 5rem 2rem; background: var(--surface); border: 1px dashed var(--border2); border-radius: 12px; }
  .empty-icon { font-size: 3rem; opacity: 0.5; margin-bottom: 1rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">Kai<span>flow</span></div>
  <div class="user-profile">
    <span id="userEmail">Chargement...</span>
    <button class="btn-primary" onclick="openNewFluxModal()">✚ Nouvelle Ligne</button>
  </div>
</header>

<main class="main-content">
  <div class="page-header">
    <div>
      <h1 class="page-title">Tour de contrôle</h1>
      <p class="page-sub">Pilotage de la performance industrielle multi-sites.</p>
    </div>
  </div>

  <div id="dashboardContainer">
    <div style="text-align:center; padding:3rem; color:var(--muted)">Analyse des flux en cours...</div>
  </div>
</main>

<div class="modal-overlay" id="newFluxModal">
  <div class="modal-content">
    <div class="modal-title">Créer un nouveau flux</div>
    <div class="input-group">
      <label>Nom de la ligne / flux</label>
      <input type="text" id="nfNom" placeholder="ex: Ligne Assemblage Stylos">
    </div>
    <div class="input-group">
      <label>Usine (Site de production)</label>
      <input type="text" id="nfUsine" placeholder="ex: Site Principal">
    </div>
    <div class="input-group">
      <label>Atelier</label>
      <input type="text" id="nfAtelier" placeholder="ex: Atelier Central">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeNewFluxModal()">Annuler</button>
      <button class="btn-submit" onclick="createNewFlux()">Créer et modéliser →</button>
    </div>
  </div>
</div>

<script type="module">
import { supabaseClient, requireAuth } from '/js/supabase-client.js';

let currentUser = null;

// ─── ALGORITHMES DÉPORTÉS DU DASHBOARD ───
function getEffectiveCycle(node) {
  if (!node) return 0; let rawCycle = node.cycle || 0;
  if (node.mos && node.mos.tasks && node.mos.tasks.length > 0) {
    const sum = node.mos.tasks.reduce((s,t) => s + (parseFloat(t.manual)||0) + (parseFloat(t.move)||0) + (parseFloat(t.wait)||0), 0);
    if (sum > 0) rawCycle = sum;
  }
  const mach = parseInt(node.machines) || 1;
  const dispo = node.dispo !== undefined ? parseFloat(node.dispo) / 100 : 1;
  const rebut = node.rebut !== undefined ? parseFloat(node.rebut) / 100 : 0;
  const den = mach * dispo * (1 - rebut);
  return den <= 0 ? Infinity : Math.round(rawCycle / den);
}

function analyzeFlux(fluxData) {
  const nodes = Array.isArray(fluxData.nodes) ? fluxData.nodes : JSON.parse(fluxData.nodes || '[]');
  const takt = fluxData.takt_time_cible || 0;
  
  if (nodes.length === 0) return { status: 'empty', takt: 0, maxCycle: 0, goulot: 'Aucun bloc', leadTime: 0, rendement: 0 };

  const workNodes = nodes.filter(n => n.type === 'work' || n.type === 'control');
  let maxCycle = 0;
  let goulotName = "Aucun goulot identifié";

  workNodes.forEach(n => {
    const c = getEffectiveCycle(n);
    if (c !== Infinity && c > maxCycle) {
      maxCycle = c;
      goulotName = n.label;
    }
  });

  const isOk = maxCycle > 0 && maxCycle <= takt;
  const rendement = maxCycle > 0 ? Math.round((takt / maxCycle) * 100) : 0;
  let status = 'empty';
  
  if (workNodes.length > 0) {
    status = isOk ? 'ok' : 'warn';
  }

  let estimatedLT = 0;
  const cadence = Math.max(takt, maxCycle);
  nodes.forEach(n => {
    if (n.type === 'stock') estimatedLT += (n.qty || 0) * cadence;
    else if (n.type === 'work' || n.type === 'control') estimatedLT += getEffectiveCycle(n);
  });

  return { takt, maxCycle, goulot: goulotName, leadTime: estimatedLT, rendement, status };
}

function formatLT(sec) {
  if (sec === 0 || sec === Infinity) return "—";
  if (sec > 86400) return Math.floor(sec/86400) + 'j';
  if (sec > 3600) return Math.floor(sec/3600) + 'h ' + Math.floor((sec%3600)/60) + 'm';
  if (sec > 60) return Math.floor(sec/60) + 'm';
  return sec + 's';
}

// ─── RENDU DU DASHBOARD ───
async function loadDashboard() {
  try {
    currentUser = await requireAuth();
    if (!currentUser) return;
    
    document.getElementById('userEmail').textContent = currentUser.email;

    // Requête robuste : on prend * pour éviter de planter si les colonnes usine/atelier manquent
    const { data: fluxList, error } = await supabaseClient
      .from('flux')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('updated_at', { ascending: false });

    const container = document.getElementById('dashboardContainer');

    if (error) {
      console.error(error);
      container.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--warn); border:1px solid var(--warn-dim); border-radius:12px;">⚠ Erreur de connexion à la base de données. Détail : ${error.message}</div>`;
      return;
    }

    if (!fluxList || fluxList.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🏭</div>
          <h2>Votre usine est vide</h2>
          <p style="color:var(--muted); margin-bottom: 2rem;">Commencez par cartographier votre première ligne de production.</p>
          <button class="btn-primary" onclick="openNewFluxModal()">Créer un flux</button>
        </div>`;
      return;
    }

    // Groupement par Usine > Atelier (avec fallback robuste)
    const tree = {};
    fluxList.forEach(f => {
      const u = f.usine || 'Site Principal';
      const a = f.atelier || 'Atelier Général';
      if (!tree[u]) tree[u] = {};
      if (!tree[u][a]) tree[u][a] = [];
      tree[u][a].push(f);
    });

    let html = '';

    for (const [usine, ateliers] of Object.entries(tree)) {
      html += `<div class="usine-section"><h2 class="usine-title">${usine}</h2>`;
      
      for (const [atelier, fluxArr] of Object.entries(ateliers)) {
        html += `<div class="atelier-section"><h3 class="atelier-title">${atelier}</h3><div class="flux-grid">`;
        
        fluxArr.forEach(f => {
          const stats = analyzeFlux(f);
          const date = new Date(f.updated_at).toLocaleDateString('fr-FR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
          
          let statusHtml = `<span class="status-badge status-empty">En cours</span>`;
          if (stats.status === 'ok') statusHtml = `<span class="status-badge status-ok">Stable</span>`;
          if (stats.status === 'warn') statusHtml = `<span class="status-badge status-warn">Goulot</span>`;

          html += `
            <a href="/editor?id=${f.id}" class="flux-card">
              <div class="card-header">
                <div>
                  <div class="card-title">${f.nom}</div>
                  <div class="card-date">Modifié le ${date}</div>
                </div>
                ${statusHtml}
              </div>
              
              <div class="card-kpis">
                <div class="ckpi">
                  <div class="ckpi-label">Takt Net</div>
                  <div class="ckpi-val ${stats.takt > 0 ? 'accent' : ''}">${stats.takt > 0 ? stats.takt+'s' : '—'}</div>
                </div>
                <div class="ckpi">
                  <div class="ckpi-label">Cycle Max</div>
                  <div class="ckpi-val ${stats.status === 'warn' ? 'warn' : (stats.status === 'ok' ? 'ok' : '')}">${stats.maxCycle > 0 ? stats.maxCycle+'s' : '—'}</div>
                </div>
                <div class="ckpi">
                  <div class="ckpi-label">Lead Time</div>
                  <div class="ckpi-val">${formatLT(stats.leadTime)}</div>
                </div>
                <div class="ckpi">
                  <div class="ckpi-label">Rendement</div>
                  <div class="ckpi-val">${stats.rendement > 0 ? stats.rendement+'%' : '—'}</div>
                </div>
              </div>
              
              <div class="goulot-line">
                <span>⚠ Limité par :</span> <span class="goulot-name">${stats.goulot}</span>
              </div>
            </a>
          `;
        });
        html += `</div></div>`;
      }
      html += `</div>`;
    }

    container.innerHTML = html;
  } catch (err) {
    console.error(err);
    document.getElementById('dashboardContainer').innerHTML = `<div style="text-align:center; padding:3rem; color:var(--warn)">Une erreur inattendue s'est produite lors du chargement.</div>`;
  }
}

// ─── MODAL CREATION ───
window.openNewFluxModal = () => document.getElementById('newFluxModal').classList.add('open');
window.closeNewFluxModal = () => document.getElementById('newFluxModal').classList.remove('open');

window.createNewFlux = async () => {
  const nom = document.getElementById('nfNom').value || 'Nouvelle Ligne';
  const usine = document.getElementById('nfUsine').value || 'Site Principal';
  const atelier = document.getElementById('nfAtelier').value || 'Atelier Général';
  
  // Création du flux (usine et atelier seront ignorés par Supabase si les colonnes n'existent pas encore, mais ça ne plantera plus)
  const payload = {
    user_id: currentUser.id,
    nom: nom,
    nodes: [],
    connections: []
  };
  
  // On tente d'ajouter usine et atelier. Si ça échoue silencieusement côté API car colonnes manquantes, on crée quand même le flux.
  try { payload.usine = usine; payload.atelier = atelier; } catch(e) {}

  const { data, error } = await supabaseClient.from('flux').insert(payload).select().single();

  if (error) {
    alert("⚠ Veuillez ajouter les colonnes 'usine' (type text) et 'atelier' (type text) dans votre table Supabase 'flux' pour classer vos lignes.");
    console.error(error);
  } else {
    window.location.href = '/editor?id=' + data.id;
  }
};

loadDashboard();
</script>
</body>
</html>
