<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kaiflow — Éditeur</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="/css/globals.css">

<style>
/* CSS Spécifique à l'Éditeur */
html, body { height: 100%; overflow: hidden; display: flex; flex-direction: column; }

/* TOPBAR */
.topbar { height: 54px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 1.2rem; gap: 1rem; flex-shrink: 0; z-index: 50; }
.topbar-sep { width: 1px; height: 20px; background: var(--border); }
.breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--muted2); }
.breadcrumb a { color: var(--muted); cursor: pointer; text-decoration: none; }
.breadcrumb a:hover { color: var(--text); }
.topbar-spacer { flex: 1; }
.flux-title-input { background: transparent; border: none; border-bottom: 1px solid transparent; outline: none; font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--text); text-align: center; padding: 0.2rem 0.5rem; transition: border-color 0.2s; width: 100%; max-width: 380px; }
.flux-title-input:focus { border-bottom-color: var(--accent); }
.topbar-actions { display: flex; gap: 0.6rem; align-items: center; }
.tb-btn { display: flex; align-items: center; gap: 0.4rem; padding: 0.45rem 1rem; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 400; cursor: pointer; transition: all 0.15s; border: 1px solid var(--border); background: transparent; color: var(--muted2); }
.tb-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
.tb-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 500; }
.tb-btn.primary:hover { box-shadow: 0 4px 16px rgba(0,229,255,0.25); }
.save-status { font-size: 0.75rem; color: var(--ok); display: flex; align-items: center; gap: 0.35rem; }
.save-status::before { content: ''; width: 6px; height: 6px; background: var(--ok); border-radius: 50%; }

/* LAYOUT */
.editor-layout { flex: 1; display: flex; overflow: hidden; position: relative; }

/* BLOCKS PANEL */
.blocks-panel { width: 190px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; z-index: 40;}
.blocks-panel::-webkit-scrollbar { width: 3px; }
.blocks-panel::-webkit-scrollbar-thumb { background: var(--border2); }
.panel-section { padding: 1rem 0.8rem 0.5rem; }
.panel-section-title { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 500; margin-bottom: 0.6rem; padding-left: 0.2rem; }
.block-template { display: flex; align-items: center; gap: 0.65rem; padding: 0.6rem 0.7rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.5rem; cursor: grab; transition: all 0.15s; background: var(--bg); user-select: none; touch-action: none; }
.block-template:hover { border-color: var(--border2); background: var(--surface2); transform: translateX(2px); }
.block-template:active { cursor: grabbing; opacity: 0.7; }
.block-icon { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; }
.block-icon.work { background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.2); }
.block-icon.stock { background: rgba(34,211,160,0.1); border: 1px solid rgba(34,211,160,0.2); }
.block-icon.transport { background: rgba(255,200,80,0.1); border: 1px solid rgba(255,200,80,0.2); }
.block-icon.control { background: rgba(160,120,255,0.1); border: 1px solid rgba(160,120,255,0.2); }
.block-name { font-size: 0.8rem; font-weight: 500; color: var(--text); }
.block-desc { font-size: 0.67rem; color: var(--muted); margin-top: 0.1rem; }
#linkModeBtn { width: calc(100% - 1.6rem); margin: 0.5rem 0.8rem; justify-content: center; border-style: dashed; }
#linkModeBtn.active { background: rgba(0,229,255,0.15); border-color: var(--accent); color: var(--accent); border-style: solid; }

/* ─── NOUVEAU CANVAS INFINI (PAN & ZOOM) ─── */
.canvas-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.canvas-toolbar { height: 42px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 1rem; gap: 0.5rem; background: var(--bg); flex-shrink: 0; z-index: 60; }
.tool-btn { width: 30px; height: 30px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted2); cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.tool-btn:hover { background: var(--surface); border-color: var(--border); color: var(--text); }
.canvas-sep { width: 1px; height: 20px; background: var(--border); margin: 0 0.3rem; }
.zoom-info { font-size: 0.75rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; width: 45px; text-align: right; }

.canvas { flex: 1; position: relative; overflow: hidden; background-color: var(--bg); background-image: linear-gradient(rgba(30,39,54,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(30,39,54,0.5) 1px, transparent 1px); background-size: 32px 32px; touch-action: none; cursor: grab; }
.canvas:active { cursor: grabbing; }

#canvasInner { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: visible; transform-origin: 0 0; }
.connections-svg { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: visible; z-index: 5; pointer-events: none; }
.drawing-line { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: visible; z-index: 100; pointer-events: none; }

.connection-path { fill: none; stroke: var(--border2); stroke-width: 2; }
.connection-path.active { stroke: var(--accent); opacity: 0.7; }
.canvas-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--muted); pointer-events: none; transition: opacity 0.3s; z-index: 2; }
.canvas-hint-icon { font-size: 2.5rem; opacity: 0.2; margin-bottom: 0.75rem; }

/* FLOW NODES */
.flow-node { position: absolute; min-width: 160px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; cursor: move; user-select: none; transition: box-shadow 0.15s, border-color 0.15s; z-index: 10; touch-action: none; }
.flow-node:hover { border-color: var(--border2); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
.flow-node.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,255,0.12), 0 8px 30px rgba(0,0,0,0.4); z-index: 20; }
.flow-node.bottleneck { border-color: var(--warn); box-shadow: 0 0 0 3px rgba(255,107,53,0.12); }
.flow-node.link-source { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,229,255,0.25); transform: scale(1.02); z-index: 25; }
.node-header { padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; border-radius: 9px 9px 0 0; }
.node-type-icon { width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; }
.node-type-icon.work { background: rgba(0,229,255,0.1); }
.node-type-icon.stock { background: rgba(34,211,160,0.1); }
.node-type-icon.transport { background: rgba(255,200,80,0.1); }
.node-type-icon.control { background: rgba(160,120,255,0.1); }
.node-label { font-family: 'Syne', sans-serif; font-size: 0.78rem; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node-body { padding: 0.5rem 0.7rem; }
.node-field { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; }
.node-field-label { font-size: 0.63rem; color: var(--muted); }
.node-field-val { font-family: 'Syne', sans-serif; font-size: 0.8rem; font-weight: 700; }
.node-field-val.ok { color: var(--ok); }
.node-field-val.warn { color: var(--warn); }
.node-field-val.neutral { color: var(--text); }
.node-field-val.accent { color: var(--accent); }
.node-vana-bar { height: 3px; display: flex; border-radius: 0 0 8px 8px; overflow: hidden; }
.vna-va { background: var(--ok); transition: width 0.4s; }
.vna-nva { background: var(--warn); transition: width 0.4s; }
.node-mos-btn { width: 100%; margin-top: 0.4rem; padding: 0.3rem; background: var(--accent-dim); border: 1px solid rgba(0,229,255,0.2); border-radius: 5px; color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 0.68rem; cursor: pointer; transition: all 0.15s; }
.port { position: absolute; width: 10px; height: 10px; background: var(--border2); border: 2px solid var(--surface); border-radius: 50%; z-index: 30; }
.port.port-out { right: -5px; top: 50%; transform: translateY(-50%); }
.port.port-in { left: -5px; top: 50%; transform: translateY(-50%); }

/* KPI BAR */
.kpi-bar { background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: stretch; flex-shrink: 0; overflow-x: auto; position: relative; z-index: 60;}
.kpi-bar::-webkit-scrollbar { height: 3px; }
.kpi-item { flex: 1; min-width: 110px; text-align: center; padding: 0.7rem 0.5rem; border-right: 1px solid var(--border); }
.kpi-item:last-child { border-right: none; }
.kpi-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; margin-bottom: 0.2rem; }
.kpi-value { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800; line-height: 1; }
.kpi-value.ok { color: var(--ok); }
.kpi-value.warn { color: var(--warn); }
.kpi-value.neutral { color: var(--text); }
.kpi-value.accent { color: var(--accent); }
.kpi-sub { font-size: 0.6rem; color: var(--muted); margin-top: 0.15rem; }
.kpi-alert-tag { display: inline-flex; align-items: center; gap: 0.3rem; background: var(--warn-dim); color: var(--warn); font-size: 0.58rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 100px; margin-top: 0.15rem; border: 1px solid rgba(255,107,53,0.25); }

/* RIGHT PANEL */
.props-panel { width: 230px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; z-index: 55;}
.props-panel::-webkit-scrollbar { width: 3px; }
.props-panel::-webkit-scrollbar-thumb { background: var(--border2); }
.props-header { padding: 0.9rem 1rem 0.7rem; border-bottom: 1px solid var(--border); }
.props-title { font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.15rem; }
.props-subtitle { font-size: 0.72rem; color: var(--muted); }
.props-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; padding: 1.5rem; text-align: center; color: var(--muted); }
.props-empty-icon { font-size: 1.8rem; opacity: 0.4; }
.props-form { padding: 0.9rem 1rem; flex: 1; display: none; }
.props-form.visible { display: block; }
.prop-unit { font-size: 0.68rem; color: var(--muted); margin-top: 0.2rem; }
.delete-btn { width: 100%; margin-top: 0.5rem; padding: 0.5rem; background: transparent; border: 1px solid rgba(255,107,53,0.3); border-radius: 7px; color: var(--warn); font-family: 'DM Sans', sans-serif; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
.delete-btn:hover { background: var(--warn-dim); border-color: var(--warn); }
.open-mos-btn { width: 100%; margin-top: 0.5rem; padding: 0.55rem; background: var(--accent-dim); border: 1px solid rgba(0,229,255,0.3); border-radius: 7px; color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }

/* YAMAZUMI PANEL */
.yamazumi-panel { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); height: 0; overflow: hidden; transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; z-index: 40; }
.yamazumi-panel.open { height: 350px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
.yamazumi-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.y-title { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 800; }
.y-subtitle { font-size: 0.75rem; color: var(--muted); }
.y-fte { font-size: 0.85rem; color: var(--text); background: var(--surface2); padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); }
.yamazumi-body { flex: 1; padding: 2rem; display: flex; justify-content: center; align-items: flex-start; overflow-x: auto; background: var(--bg); }
.y-chart-area { position: relative; height: 180px; margin-top: 10px; display: flex; align-items: flex-end; gap: 2.5rem; border-bottom: 2px solid var(--border2); padding: 0 2rem; min-width: 100%; justify-content: center; }
.takt-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--warn); z-index: 5; pointer-events: none; }
.takt-line span { background: var(--warn-dim); color: var(--warn); font-size: 0.65rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 4px; position: absolute; top: -10px; left: 1rem; border: 1px solid rgba(255,107,53,0.3); }
.y-col { position: relative; width: 60px; height: 100%; display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.y-bar { width: 100%; background: var(--accent-dim); border: 1px solid rgba(0,229,255,0.3); border-bottom: none; border-radius: 4px 4px 0 0; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; transition: height 0.3s; }
.y-bar.goulot { background: var(--warn-dim); border-color: rgba(255,107,53,0.4); }
.y-val { position: absolute; width: 100%; text-align: center; font-family: 'Syne', sans-serif; font-size: 0.8rem; font-weight: 700; color: var(--text); transition: bottom 0.3s; }
.y-val.warn { color: var(--warn); }
.y-label { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: 120px; text-align: center; font-size: 0.65rem; color: var(--muted2); font-weight: 500; line-height: 1.3; }

/* MODALS */
.mos-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; backdrop-filter: blur(6px); padding: 1rem; }
.mos-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 18px; width: 100%; max-width: 820px; max-height: 92vh; display: flex; flex-direction: column; transform: translateY(24px); transition: transform 0.25s; box-shadow: 0 40px 100px rgba(0,0,0,0.6); overflow: hidden; }
.mos-overlay.open .modal { transform: translateY(0); }
.mos-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
.mos-title-group { flex: 1; }
.mos-title { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 800; margin-bottom: 0.2rem; }
.mos-subtitle { font-size: 0.75rem; color: var(--muted); }
.mos-close { width: 32px; height: 32px; border-radius: 8px; background: transparent; border: 1px solid var(--border); color: var(--muted2); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.mos-summary { display: flex; padding: 0.8rem 1.5rem; gap: 0; border-bottom: 1px solid var(--border); background: var(--bg); flex-wrap: wrap; }
.mos-kpi { flex: 1; min-width: 60px; text-align: center; border-right: 1px solid var(--border); }
.mos-kpi:last-child { border-right: none; }
.mos-kpi-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.2rem; }
.mos-kpi-val { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; }
.mos-kpi-val.manual { color: var(--manual); } .mos-kpi-val.machine { color: var(--machine); } .mos-kpi-val.move { color: var(--move); } .mos-kpi-val.wait { color: var(--wait); } .mos-kpi-val.total { color: var(--accent); }
.mos-gantt { padding: 0.6rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--bg); }
.mos-gantt-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
.mos-gantt-bar { height: 12px; display: flex; border-radius: 4px; overflow: hidden; gap: 1px; background: var(--border); }
.gantt-seg { height: 100%; transition: width 0.4s; position: relative; }
.gantt-seg.manual { background: var(--manual); } .gantt-seg.machine { background: var(--machine); } .gantt-seg.move { background: var(--move); } .gantt-seg.wait { background: var(--wait); }
.mos-body { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
.mos-body::-webkit-scrollbar { width: 4px; }
.mos-body::-webkit-scrollbar-thumb { background: var(--border2); }
.mos-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-bottom: 1.2rem; }
.tasks-section-title { font-family: 'Syne', sans-serif; font-size: 0.8rem; font-weight: 700; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; margin-top: 0.5rem; }

/* CHRONO PANEL */
.chrono-panel { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 1.5rem; text-align: center; }
#chronoDisplay { font-family: 'Syne', sans-serif; font-size: 3rem; font-weight: 800; color: var(--text); margin-bottom: 0.8rem; font-variant-numeric: tabular-nums; }
.chrono-actions { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
.chrono-actions .tb-btn { flex: 1; justify-content: center; font-size: 0.9rem; padding: 0.6rem; min-width: 100px; }

/* TASKS LIST */
.tasks-header { display: grid; grid-template-columns: 28px 1fr 72px 72px 72px 72px 72px 80px; gap: 0.4rem; align-items: center; padding: 0.3rem 0.5rem; margin-bottom: 0.3rem; }
.th { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; text-align: center; }
.th.left { text-align: left; }
.task-row { display: grid; grid-template-columns: 28px 1fr 72px 72px 72px 72px 72px 80px; gap: 0.4rem; align-items: center; padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.4rem; background: var(--bg); transition: border-color 0.15s; }
.task-row.has-data { border-left: 3px solid; }
.task-row.va { border-left-color: var(--ok); } .task-row.nva { border-left-color: var(--warn); }
.task-num { font-family: 'Syne', sans-serif; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-align: center; }
.task-main { display: flex; flex-direction: column; width: 100%; }
.task-input { background: transparent; border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; color: var(--text); width: 100%; padding: 0.2rem 0; }
.time-wrap { display: flex; align-items: center; justify-content: center; width: 100%; }
.time-wrap::before { display: none; }
.task-time-input { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; outline: none; font-family: 'Syne', sans-serif; font-size: 0.8rem; font-weight: 600; color: var(--text); width: 100%; padding: 0.3rem; text-align: center; transition: border-color 0.15s; }
.task-cumul { font-family: 'Syne', sans-serif; font-size: 0.75rem; color: var(--accent); text-align: center; font-weight: 600; }
.task-del { background: transparent; border: 1px solid var(--border); border-radius: 5px; color: var(--warn); cursor: pointer; font-size: 0.7rem; padding: 0.3rem; width: 100%; }
.task-type-tag { display: flex; gap: 0.3rem; margin-top: 0.15rem; }
.type-badge { font-size: 0.58rem; padding: 0.1rem 0.4rem; border-radius: 100px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; }
.type-badge.va-tag { background: var(--ok-dim); color: var(--ok); border-color: rgba(34,211,160,0.2); }
.type-badge.nva-tag { background: var(--warn-dim); color: var(--warn); border-color: rgba(255,107,53,0.2); }
.type-badge.active { opacity: 1; } .type-badge:not(.active) { opacity: 0.35; }
.add-task-btn { width: 100%; margin-top: 0.5rem; padding: 0.75rem; background: transparent; border: 1px dashed var(--border2); border-radius: 8px; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }

.noncycles-section { margin-top: 1.2rem; border-top: 1px solid var(--border); padding-top: 0.9rem; }
.nc-row { display: grid; grid-template-columns: 1fr 60px 60px 60px 80px; gap: 0.4rem; align-items: center; padding: 0.3rem 0.5rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.35rem; background: var(--bg); }
.mos-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.mos-footer-kpi { font-size: 0.78rem; color: var(--muted2); }
.mos-save-btn { margin-left: auto; background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 0.6rem 1.4rem; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }

.modal-btn-cancel { flex: 1; padding: 0.75rem; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--muted2); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; cursor: pointer; transition: border-color 0.15s; }
