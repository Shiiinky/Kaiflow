<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaiflow — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0b0e14; --surface: #111620; --border: #1e2736; --border2: #253044;
  --accent: #00e5ff; --accent-dim: rgba(0,229,255,0.1);
  --ok: #22d3a0; --warn: #ff6b35;
  --text: #e2e8f5; --muted: #5a6a85; --muted2: #8899b4;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'DM Sans', sans-serif; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden; position: relative;
}

/* Background grid */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(30,39,54,0.6) 1px, transparent 1px), linear-gradient(90deg, rgba(30,39,54,0.6) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}

/* Glow */
.glow {
  position: fixed;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(0,229,255,0.07) 0%, transparent 70%);
  top: 50%; left: 50%; transform: translate(-50%, -60%);
  pointer-events: none;
}

.card {
  position: relative; z-index: 10;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2.5rem;
  width: min(92vw, 420px);
  box-shadow: 0 40px 80px rgba(0,0,0,0.5);
  animation: fadeUp 0.5s ease both;
}

@keyframes fadeUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform:translateY(0); } }

.logo {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: 1.4rem; letter-spacing: -0.02em;
  margin-bottom: 0.3rem;
}
.logo em { font-style: normal; color: var(--accent); }

.card-title {
  font-family: 'Syne', sans-serif; font-size: 1.3rem;
  font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.3rem;
}
.card-sub { font-size: 0.87rem; color: var(--muted2); margin-bottom: 2rem; }

.field { margin-bottom: 1.1rem; }
.field label {
  display: block; font-size: 0.72rem; text-transform: uppercase;
  letter-spacing: 0.09em; color: var(--muted); font-weight: 500; margin-bottom: 0.4rem;
}
.field input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 0.75rem 1rem;
  font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
  color: var(--text); outline: none; transition: border-color 0.2s;
}
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--muted); }

.btn-primary {
  width: 100%; padding: 0.85rem;
  background: var(--accent); border: none; border-radius: 10px;
  font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 500;
  color: #000; cursor: pointer; margin-top: 0.5rem;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,229,255,0.25); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.divider {
  display: flex; align-items: center; gap: 0.75rem;
  margin: 1.2rem 0; color: var(--muted); font-size: 0.8rem;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.card-footer {
  text-align: center; margin-top: 1.5rem;
  font-size: 0.85rem; color: var(--muted2);
}
.card-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
.card-footer a:hover { text-decoration: underline; }

.alert {
  padding: 0.75rem 1rem; border-radius: 8px;
  font-size: 0.85rem; margin-bottom: 1rem;
  display: none;
}
.alert.error { background: rgba(255,107,53,0.1); border: 1px solid rgba(255,107,53,0.3); color: var(--warn); display: flex; align-items: center; gap: 0.5rem; }
.alert.success { background: rgba(34,211,160,0.1); border: 1px solid rgba(34,211,160,0.3); color: var(--ok); display: flex; align-items: center; gap: 0.5rem; }

.forgot { text-align: right; margin-top: 0.3rem; }
.forgot a { font-size: 0.78rem; color: var(--muted); text-decoration: none; }
.forgot a:hover { color: var(--accent); }

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(0,0,0,0.3);
  border-top-color: #000;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: inline-block; margin-right: 0.5rem; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="glow"></div>

<div class="card">
  <div class="logo">Kai<em>flow</em></div>
  <div class="card-title">Connexion</div>
  <div class="card-sub">Accédez à vos flux de production</div>

  <div class="alert" id="alert"></div>

  <div class="field">
    <label>Email professionnel</label>
    <input type="email" id="email" placeholder="vous@entreprise.fr" autocomplete="email">
  </div>
  <div class="field">
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    <div class="forgot"><a href="#">Mot de passe oublié ?</a></div>
  </div>

  <button class="btn-primary" id="loginBtn" onclick="login()">Se connecter</button>

  <div class="divider">ou</div>

  <div class="card-footer">
    Pas encore de compte ? <a href="/signup">Créer un compte</a>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tjgpmdsaorhoshkprecc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqZ3BtZHNhb3Job3Noa3ByZWNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDI4MTMsImV4cCI6MjA5Mjk3ODgxM30.ZpLeIKRHx46kq41AzRKnydmz-3U61-5kdM1ZVj-29H8';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Redirect if already logged in
supabase.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = '/dashboard';
});

function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = (type==='error' ? '⚠ ' : '✓ ') + msg;
  el.className = 'alert ' + type;
}

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');

  if (!email || !password) { showAlert('Veuillez remplir tous les champs.', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Connexion…';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    showAlert(error.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect.' : error.message, 'error');
    btn.disabled = false; btn.textContent = 'Se connecter';
  } else {
    showAlert('Connexion réussie ! Redirection…', 'success');
    setTimeout(() => window.location.href = '/dashboard', 1000);
  }
}

// Enter key
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
