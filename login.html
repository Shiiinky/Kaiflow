<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaiflow — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/globals.css">
<style>
  /* CSS Spécifique à la page de Login uniquement */
  body {
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(30,39,54,0.6) 1px, transparent 1px), linear-gradient(90deg, rgba(30,39,54,0.6) 1px, transparent 1px);
    background-size: 48px 48px; pointer-events: none;
  }
  .glow {
    position: fixed; width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,229,255,0.07) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -60%); pointer-events: none;
  }
  .card {
    position: relative; z-index: 10; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 2.5rem; width: min(92vw, 420px);
    box-shadow: 0 40px 80px rgba(0,0,0,0.5); animation: fadeUp 0.5s ease both;
  }
  .card-title { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.3rem; }
  .card-sub { font-size: 0.87rem; color: var(--muted2); margin-bottom: 2rem; }
  .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.2rem 0; color: var(--muted); font-size: 0.8rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .card-footer { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted2); }
  .card-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .forgot { text-align: right; margin-top: 0.3rem; }
  .forgot a { font-size: 0.78rem; color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="card">
  <div class="logo">Kai<em>flow</em></div>
  <div class="card-title">Connexion</div>
  <div class="card-sub">Accédez à vos flux de production</div>

  <div class="alert" id="alert"></div>

  <div class="field">
    <label>Email professionnel</label>
    <input type="email" id="email" placeholder="vous@entreprise.fr" autocomplete="email">
  </div>
  <div class="field">
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    <div class="forgot"><a href="#" id="forgotBtn">Mot de passe oublié ?</a></div>
  </div>

  <button class="btn-primary" id="loginBtn">Se connecter</button>

  <div class="divider">ou</div>

  <div class="card-footer">
    Pas encore de compte ? <a href="/signup">Créer un compte</a>
  </div>
</div>

<script type="module">
  import { supabaseClient } from '/js/supabase-client.js';

  // Redirect if already logged in
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = '/dashboard';
  });

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = (type==='error' ? '⚠ ' : '✓ ') + msg;
    el.className = 'alert ' + type;
    el.style.display = 'flex';
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');

    if (!email || !password) { showAlert('Veuillez remplir tous les champs.', 'error'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Connexion…';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showAlert(error.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect.' : error.message, 'error');
      btn.disabled = false; btn.textContent = 'Se connecter';
    } else {
      showAlert('Connexion réussie ! Redirection…', 'success');
      setTimeout(() => window.location.href = '/dashboard', 1000);
    }
  });

  document.getElementById('forgotBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      showAlert('Entrez votre email ci-dessus puis cliquez sur "Mot de passe oublié".', 'error');
      return;
    }
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/account'
    });
    if (error) showAlert('Erreur : ' + error.message, 'error');
    else showAlert('Email de réinitialisation envoyé.', 'success');
  });

  document.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
</script>
</body>
</html>
