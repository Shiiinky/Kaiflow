<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaiflow — Créer un compte</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/globals.css">
<style>
/* Specific CSS for Signup */
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem; position: relative; }
body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(30,39,54,0.6) 1px, transparent 1px), linear-gradient(90deg, rgba(30,39,54,0.6) 1px, transparent 1px); background-size: 48px 48px; pointer-events: none; }
.glow { position: fixed; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,229,255,0.07) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -60%); pointer-events: none; }
.card { position: relative; z-index: 10; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: min(92vw, 460px); box-shadow: 0 40px 80px rgba(0,0,0,0.5); animation: fadeUp 0.5s ease both; }
.card-title { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.3rem; }
.card-sub { font-size: 0.87rem; color: var(--muted2); margin-bottom: 2rem; }
.fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.cgu { font-size: 0.78rem; color: var(--muted); margin-top: 0.75rem; text-align: center; line-height: 1.5; }
.cgu a { color: var(--accent); text-decoration: none; }
.card-footer { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted2); }
.card-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1rem; }
.plan-option { border: 1.5px solid var(--border); border-radius: 10px; padding: 0.8rem; cursor: pointer; transition: all 0.15s; }
.plan-option:hover { border-color: var(--border2); }
.plan-option.selected { border-color: var(--accent); background: var(--accent-dim); }
.plan-option input { display: none; }
.plan-name { font-family: 'Syne', sans-serif; font-size: 0.88rem; font-weight: 700; margin-bottom: 0.2rem; }
.plan-price { font-size: 0.75rem; color: var(--muted2); }
.plan-option.selected .plan-price { color: var(--accent); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="card">
  <div class="logo">Kai<em>flow</em></div>
  <div class="card-title">Créer un compte</div>
  <div class="card-sub">Commencez gratuitement, sans carte bancaire</div>

  <div class="alert" id="alert"></div>

  <div class="fields-row">
    <div class="field"><label>Prénom</label><input type="text" id="firstName" placeholder="Jean"></div>
    <div class="field"><label>Nom</label><input type="text" id="lastName" placeholder="Dupont"></div>
  </div>

  <div class="field"><label>Entreprise</label><input type="text" id="company" placeholder="Nom de votre entreprise"></div>
  <div class="field"><label>Email professionnel</label><input type="email" id="email" placeholder="vous@entreprise.fr" autocomplete="email"></div>
  <div class="field"><label>Mot de passe</label><input type="password" id="password" placeholder="8 caractères minimum" autocomplete="new-password"></div>

  <div style="margin-bottom:1rem;">
    <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);font-weight:500;margin-bottom:0.6rem;">Plan</div>
    <div class="plan-grid">
      <label class="plan-option selected" id="plan-free">
        <input type="radio" name="plan" value="free" checked>
        <div class="plan-name">Starter</div>
        <div class="plan-price">Gratuit · 1 flux</div>
      </label>
      <label class="plan-option" id="plan-pro">
        <input type="radio" name="plan" value="pro">
        <div class="plan-name">Pro</div>
        <div class="plan-price">49€ / mois · Illimité</div>
      </label>
    </div>
  </div>

  <button class="btn-primary" id="signupBtn" onclick="signup()">Créer mon compte</button>

  <div class="cgu">En créant un compte, vous acceptez nos <a href="#">Conditions d'utilisation</a>.</div>
  <div class="card-footer">Déjà un compte ? <a href="/login">Se connecter</a></div>
</div>

<script type="module">
  import { supabaseClient } from '/js/supabase-client.js';

  // UI Selection Plan
  document.querySelectorAll('.plan-option').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.plan-option').forEach(p => p.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  window.signup = async function() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const company = document.getElementById('company').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const plan = document.querySelector('input[name="plan"]:checked').value;
    const btn = document.getElementById('signupBtn');
    const alertEl = document.getElementById('alert');

    if (!firstName || !lastName || !email || !password) { 
      alertEl.textContent = '⚠ Remplissez tous les champs.'; alertEl.className = 'alert error'; alertEl.style.display = 'flex'; return; 
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Création…';

    const { error } = await supabaseClient.auth.signUp({
      email, password,
      options: { data: { first_name: firstName, last_name: lastName, company, plan } }
    });

    if (error) {
      alertEl.innerHTML = '⚠ Erreur : ' + error.message; alertEl.className = 'alert error'; alertEl.style.display = 'flex';
      btn.disabled = false; btn.textContent = 'Créer mon compte';
    } else {
      alertEl.textContent = '✓ Compte créé ! Redirection...'; alertEl.className = 'alert success'; alertEl.style.display = 'flex';
      setTimeout(() => window.location.href = '/login', 2000);
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') signup(); });
</script>
</body>
</html>
